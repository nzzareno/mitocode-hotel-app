<div class="demo-button-container">
    <button matButton (click)="openAddNewReservationDialog()" class="demo-button" [class.light-theme]="!isDarkMode()" [class.dark-theme]="isDarkMode()">
      ADD NEW RESERVATION
    </button>
  </div>

  <table mat-table [dataSource]="reservations()" class="demo-table">

    <!-- Customer Name Column -->
    <ng-container matColumnDef="customerName">
      <th mat-header-cell *matHeaderCellDef style="width: 25%; text-align: center; text-transform: uppercase;">Customer Name</th>
      <td mat-cell *matCellDef="let reservation" style="width: fit-content !important; text-align: center !important; padding-left: 5rem !important;">{{reservation.customerName}}</td>
    </ng-container>

    <!-- Check In Date Column -->
    <ng-container matColumnDef="checkInDate">
      <th mat-header-cell *matHeaderCellDef style="width: 25%; text-align: center; padding: 0 7px 0 0 !important; text-transform: uppercase;">Check In Date</th>
      <td mat-cell *matCellDef="let reservation" style="width: 25%; text-align: center;">{{reservation.checkInDate | date}}</td>
    </ng-container>

    <!-- Check Out Date Column -->
    <ng-container matColumnDef="checkOutDate">
      <th mat-header-cell *matHeaderCellDef style="width: 25%; text-align: right; padding: 0 3px 0 0 !important; text-transform: uppercase;">Check Out Date</th>
      <td mat-cell *matCellDef="let reservation" style="width: 25%; text-align: right;">{{reservation.checkOutDate | date}}</td>
    </ng-container>

    <!-- Room Number Column -->
    <ng-container matColumnDef="room">
      <th mat-header-cell *matHeaderCellDef style="width: 25%; text-align: center; padding: 0 3px 0 0 !important; text-transform: uppercase;">Room</th>
      <td mat-cell *matCellDef="let reservation" style="width: 25%; text-align: center;">{{reservation.room?.roomNumber}}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns();"></tr>
  </table>
